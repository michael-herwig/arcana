# yaml-language-server: $schema=https://taskfile.dev/schema.json
#
# Release preparation for arcana. Mirrors ../grimoire-vscode's
# release:prepare, adapted to grim: there is no version file to bump (bundles
# ref `:latest`, grimoire.toml carries no version) — the release version IS
# the git tag. git-cliff computes the next version from conventional commits
# and regenerates the changelogs (root + per-bundle) at that tag.

version: '3'

tasks:
  # Single source of truth for changelog generation. Root CHANGELOG.md spans
  # the whole repo; each bundle group (top-level dir with a <dir>/<dir>.toml
  # manifest) gets its own scoped one. Pass TAG=vX.Y.Z to cut a release
  # section; omit it for a rolling `Unreleased` section.
  #
  # PREPEND, never regenerate. Released sections are hand-authored — hex 0.3.0's
  # notes say what shipping nox means, and nothing built from commit subjects
  # would say it — so `--unreleased` renders one section and everything already
  # in the file is frozen. git-cliff's own `--prepend` is not used: it re-emits
  # the [changelog] header on every render and glues the section above the file's
  # title, so `--strip header` plus taskfiles/changelog.py puts it where it goes.
  # That script also drops an empty section, replaces a rolling `Unreleased`
  # rather than stacking it, and no-ops on a heading the file already carries.
  #
  # CLIFF_BUNDLE names the bundle to cliff.toml's header template, which is how
  # a bundle gets its own preamble out of the shared config (nox's release-train
  # note). Unset for the root changelog. The header is still what writes a
  # bundle's FIRST changelog, which is the one case with no file to prepend to.
  changelog:
    desc: 'Add an unreleased CHANGELOG.md section (root + per-bundle); TAG=vX.Y.Z cuts it as a release'
    cmds:
      - |
        set -eu
        tag_flag=""
        if [ -n "{{.TAG}}" ]; then tag_flag="--tag {{.TAG}}"; fi
        section="$(mktemp)"

        cut() {
          file="$1"
          shift
          if [ -f "$file" ]; then
            git-cliff --unreleased $tag_flag --strip header "$@" -o "$section"
            python3 taskfiles/changelog.py "$file" "$section"
          else
            git-cliff $tag_flag "$@" -o "$file"
          fi
        }

        cut CHANGELOG.md
        for manifest in */*.toml; do
          dir="${manifest%%/*}"
          [ "$dir/$dir.toml" = "$manifest" ] || continue
          export CLIFF_BUNDLE="$dir"
          cut "$dir/CHANGELOG.md" --include-path "$dir/**"
        done
        rm -f "$section"

  # Full release preparation: compute next version, regenerate the changelogs
  # tagged at it (via release:changelog), run the publish dry-run gate. After
  # this succeeds, the human reviews, commits, tags, and pushes.
  #
  # Version selection:
  #   task release:prepare                 # interactive menu: auto | patch | minor | major
  #   task release:prepare BUMP=minor      # skip the menu, force a bump level
  #   task release:prepare BUMP=auto VERSION=1.4.0   # pin an exact version (v prefix optional)
  #
  # BUMP is a required enum: with interactive mode on (.taskrc.yml) and a TTY it
  # renders a selection menu; on CI / no TTY it must be passed on the CLI.
  prepare:
    desc: 'Prepare a release (interactive: pick auto|patch|minor|major; or BUMP=<level> / VERSION=x.y.z)'
    requires:
      vars:
        - name: BUMP
          enum: [auto, patch, minor, major]
    vars:
      # git-cliff computes the next version from git history. `auto` lets it pick
      # the bump from conventional commits; otherwise BUMP forces the level.
      # VERSION pins an exact value and wins over BUMP.
      NEXT_VERSION:
        sh: |
          if [ -n "{{.VERSION}}" ]; then
            printf 'v%s' "{{.VERSION | default "" | trimPrefix "v"}}"
          elif [ "{{.BUMP}}" = "auto" ]; then
            git-cliff --bumped-version
          else
            git-cliff --bumped-version --bump "{{.BUMP}}"
          fi
    cmds:
      - echo "Next version:{{.NEXT_VERSION}}"
      # The C-1037(4) nox release gate runs here, on a clean tree, before the
      # changelog dirties it. It also refuses a version the nox subtree does not
      # already agree on — nothing auto-bumps inside a release about to be signed.
      - NOX_RELEASE_VERSION={{.NEXT_VERSION}} task nox:release-gate
      - task: changelog
        vars: { TAG: '{{.NEXT_VERSION}}' }
      - task publish -- --dry-run
      # The digest is read off the artifact the gate just built, with stdlib
      # hashlib (no coreutils bet), so the signed tag message carries the exact
      # bytes publish.yml rebuilds and compares against.
      - |
        digest="$(python3 -c 'import hashlib, pathlib; print(hashlib.sha256(pathlib.Path("nox/nox-review/scripts/nox.pyz").read_bytes()).hexdigest())')"
        echo ""
        echo "Release prepared ({{.NEXT_VERSION}}). Review changes, then:"
        echo "  git add -A && git commit -m 'release: {{.NEXT_VERSION}}'"
        echo "  git tag -s {{.NEXT_VERSION}} -m 'nox.pyz sha256: $digest'"
        echo "  git push --atomic origin main {{.NEXT_VERSION}}"
