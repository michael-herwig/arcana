summary = "Tiered multi-agent swarm orchestration: plan, execute, review, architect"
description = "Swarm orchestration bundle: four tiered orchestrator skills covering the full feature lifecycle - planning, contract-first TDD execution, adversarial review, and architecture design. Each scales worker count, model choice, and review breadth via a low|medium|high tier (auto default) plus single-axis overlays. Fronted by a pre-plan discussion mode that talks a problem through before any plan exists, closed by a branch-finalization command that verifies, recomposes and, after one approval gate, force-pushes a review-approved feature branch - degrading to a local-only run where no forge CLI is present, and backed by an always-on rule that re-anchors hex state from files after context loss."
keywords = "swarm,orchestration,multi-agent,planning,tdd,review,architecture,discussion,context-recovery,finalize,force-push"
license = "Apache-2.0"
repository = "https://github.com/michael-herwig/arcana"

[skills]
"hex-core" = "./hex-core:latest"
"hex-init" = "./hex-init:latest"
"hex-plan" = "./hex-plan:latest"
"hex-execute" = "./hex-execute:latest"
"hex-review" = "./hex-review:latest"
"hex-architect" = "./hex-architect:latest"
"hex-discuss" = "./hex-discuss:latest"
"hex-finalize" = "./hex-finalize:latest"

[rules]
"hex-state" = "./hex-state:latest"
