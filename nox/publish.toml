#:schema https://grimoire.rs/schemas/grim-publish.schema.json
# Every arcana artifact publishes under the `arcana` namespace:
# ghcr.io/michael-herwig/arcana/<name>. nox rides arcana's single release
# train (D-aa/E13): one `v*` tag publishes hex and nox together.
registry = "ghcr.io"
repository_prefix = "michael-herwig/arcana"
# Static placeholder: `grim publish --dry-run` exits 65 on a version-less
# manifest. `publish.yml` passes `--version <tag>`, which overrides it.
version = "0.4.1"

# Announced to the public index like hex (owner decision 2026-09-06, supersedes
# C-1037(5)'s "not in v1"): fork grimoire-rs/index → michael-herwig/index-1 and
# open a cross-repo PR, even though the token has upstream push.
[announce]
namespace = "michael-herwig"
fork = "always"

[description]
readme = "README.md"
logo = "assets/nox.svg"
# Generated by `task release:changelog` (git-cliff, --include-path "nox/**").
changelog = "CHANGELOG.md"

[skills."nox-review"]
path = "nox-review"

[bundles.nox]
path = "nox.toml"
