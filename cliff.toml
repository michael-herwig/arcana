# git-cliff configuration — https://git-cliff.org/docs/configuration
#
# The repo is versioned as ONE (a single tag line across all bundles); a
# bundle's changelog is scoped per invocation via `--include-path`, not by
# a separate config per bundle. See taskfiles/release.taskfile.yml's
# `release:changelog` task.

[changelog]
# The header is a Tera template, and the whole changelog — header included — is
# REGENERATED on every `task release:changelog`, so a preamble that only exists
# in a committed CHANGELOG.md does not survive. A bundle whose changelog needs
# its own preamble therefore states it here: `release:changelog` exports
# `CLIFF_BUNDLE=<dir>` for each `--include-path` invocation and leaves it unset
# for the root changelog, which keeps one config for every bundle (the rule
# above) while still letting one bundle differ.
header = """
{%- set bundle = get_env(name="CLIFF_BUNDLE", default="") -%}
# Changelog

{% if bundle == "nox" -%}
All notable changes to nox. Regenerated by `task release:changelog`
(git-cliff, scoped to `nox/**`); do not hand-edit.

**The version is arcana's, not nox's.** nox rides the repository's single
release train (D-aa): one `v*` tag publishes hex and nox together, so nox's
version *is* that tag. Its first release is therefore `0.3.0` — the number
tracks the train, never a cadence of nox's own, and it is bumped in
`pyproject.toml`, `src/nox/__init__.py` and `nox-review/SKILL.md` together or
the release gate refuses to sign.
{% else -%}
All notable changes to this project will be documented in this file.
{%- endif %}
"""
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group }}
    {% for commit in commits %}
        - {{ commit.message | split(pat="\n") | first | trim }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^docs", group = "Documentation" },
    { message = "^refactor", group = "Changed" },
    { message = "^perf", group = "Changed" },
    { message = "^chore", group = "Chores" },
    { message = "^test", group = "Tests" },
    { message = ".*", group = "Other" },
]
filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"

[bump]
initial_tag = "v0.1.0"           # first release when no tags exist yet
features_always_bump_minor = true
breaking_always_bump_major = false # stay pre-1.0 until intentional
