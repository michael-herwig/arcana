name: publish

on:
  push:
    tags: ['v[0-9]*']         # matches cliff.toml tag_pattern; version comes from the tag
  workflow_dispatch: {}        # manual dry-run smoke test

permissions:
  contents: read
  packages: write              # push bundle bytes to ghcr.io/michael-herwig/*

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history and tags: the publish path is tag-driven and nothing
          # here is helped by a shallow clone.
          fetch-depth: 0
          # The job holds `packages: write`, and the announce authenticates
          # through `gh auth setup-git`'s global credential helper against a
          # different repository (the fork), so nothing here needs the checkout
          # token left readable in .git/config for the whole job.
          persist-credentials: false

      # Must precede `task nox:verify`: tests/unit/test_skill_contract.py proves
      # the .pyz is packed by invoking this pinned grim, not whatever is on the box.
      - uses: grimoire-rs/setup-grimoire@a1c530c44cbf7722731a756fcfe3a28b527c85c3 # v1.2.0
        with:
          version: v0.11.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          python-version: '3.11'
          working-directory: nox

      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag agrees with nox/pyproject.toml
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          project="$(awk -F'"' '/^version = /{print $2; exit}' nox/pyproject.toml)"
          if [ "$tag" != "$project" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match nox/pyproject.toml version $project."
            exit 1
          fi

      - name: Sync
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: uv sync --locked --extra dev
        working-directory: nox

      - name: Verify
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: task nox:verify

      - name: Build nox.pyz
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          task nox:build

      - name: Assert the published file set
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          test -s nox/nox-review/scripts/nox.pyz
          # grim packs the whole directory and is gitignore-blind, so anything
          # stale in it ships. `! -type d` because `-type f` sees neither a
          # symlink nor anything behind a symlinked directory.
          found="$(cd nox/nox-review && find . -mindepth 1 ! -type d -print | sed 's|^\./||' | LC_ALL=C sort)"
          expected="$(printf 'SKILL.md\nscripts/nox.pyz')"
          if [ "$found" != "$expected" ]; then
            echo "::error::nox/nox-review must hold exactly SKILL.md and scripts/nox.pyz; found: $(echo $found)"
            exit 1
          fi

      # Isolate the Docker credential store to the job (runner.temp is only
      # available inside steps, not in job-level env).
      - name: Isolate Docker credential store
        run: |
          mkdir -p "$RUNNER_TEMP/docker"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | grim login ghcr.io -u "${{ github.actor }}" \
            --password-stdin --allow-insecure-store

      # Manual dispatch = validate the manifest, push nothing.
      # `canary` is a non-semver channel tag so it never cascades or skip-exists.
      - name: Dry run (manual)
        if: github.event_name == 'workflow_dispatch'
        run: |
          grim publish --manifest hex/publish.toml --version canary --dry-run
          grim publish --manifest nox/publish.toml --version canary --dry-run

      # nox is not announced to the public index in v1 (C-1037(5)), so it goes
      # first: one tag ships hex and nox together (D-aa) and neither push is
      # transactional, so the ordering is chosen to keep the one *irreversible*
      # act — the announce — last. A failure here publishes nothing and
      # announces nothing; a failure in the step below leaves nox's bytes on
      # ghcr.io with no announce claiming a release, and re-running the workflow
      # is safe because a publish skips-existing by default.
      - name: Publish nox
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          grim publish --manifest nox/publish.toml --version "$GITHUB_REF_NAME"

      # Tag push = real release: bytes to ghcr.io, then announce (fork → PR to public index).
      # --version <tag> overrides the static placeholder `version` in publish.toml
      # and cascades X.Y / X / latest for all 7 entries.
      - name: Publish + announce
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          # A classic PAT (or the gh token) that can read grimoire-rs/index —
          # a fine-grained token scoped to the fork 403s there and can't fork.
          GH_TOKEN: ${{ secrets.GRIM_ANNOUNCE_TOKEN }}
          GRIM_ANNOUNCE_TOKEN: ${{ secrets.GRIM_ANNOUNCE_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then gh auth setup-git; fi
          set +e
          # The env var, never the expression form: an Actions expression is spliced
          # into the script text before bash sees it, and a git ref name may legally
          # carry shell metacharacters — in a job holding packages: write.
          grim publish --manifest hex/publish.toml \
            --version "$GITHUB_REF_NAME" --announce --format json \
            2> "$RUNNER_TEMP/publish.err" | tee "$RUNNER_TEMP/publish.json"
          rc=${PIPESTATUS[0]}
          set -e
          cat "$RUNNER_TEMP/publish.err" >&2 || true
          jq -r '.announce // empty | "announce: \(.outcome) \(.branch // "") \(.url // "") fork=\(.fork.repo // "none")"' \
            "$RUNNER_TEMP/publish.json" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          # Bytes-published is the hard gate; an announce-only failure (exit 69) soft-warns.
          if [ "$rc" -eq 69 ]; then
            echo "::warning::Bundle published to ghcr.io, but the index announce did not complete (exit 69): $(tail -n1 "$RUNNER_TEMP/publish.err")"
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

      - name: Log out of GHCR
        if: always()
        run: grim logout ghcr.io || true
